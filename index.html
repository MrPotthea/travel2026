    <style>
        /* ========== SIMPLE GALLERY - NO BORDER RADIUS, NO HOVER EFFECT ========== */

        /* Remove border radius from all images */
        img {
            border-radius: 0 !important;
        }

        .gallery-item {
            position: relative;
            overflow: visible;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: none;
            /* No hover effect */
            border-radius: 0 !important;
        }

        /* No hover zoom, no opacity change */
        .gallery-item:hover img {
            transform: none;
            opacity: 1;
        }

        /* No overlay on hover - completely removed */
        .gallery-overlay {
            display: none;
        }

        /* Simple click hint */
        .click-hint {
            font-size: 12px;
            color: #17bed2;
            margin-top: 8px;
            display: inline-block;
            background: rgba(23, 190, 210, 0.1);
            padding: 4px 12px;
            border-radius: 30px;
        }

        .click-hint i {
            margin-right: 5px;
        }

        /* Masonry grid spacing */
        .masonry-grid-item {
            padding: 0 10px 20px 10px;
        }

        /* Lightbox Modal Styles - Full screen image viewer */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
            animation: fadeInLightbox 0.25s ease;
        }

        @keyframes fadeInLightbox {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
        }

        .lightbox-image {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            cursor: default;
            animation: zoomInImg 0.25s cubic-bezier(0.2, 0.8, 0.4, 1);
            border-radius: 0 !important;
        }

        @keyframes zoomInImg {
            from {
                transform: scale(0.88);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .lightbox-close {
            position: fixed;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 42px;
            cursor: pointer;
            z-index: 100000;
            opacity: 0.8;
            transition: opacity 0.2s, transform 0.2s;
            font-weight: 300;
            font-family: Arial, sans-serif;
        }

        .lightbox-close:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .lightbox-caption {
            position: fixed;
            bottom: 25px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            letter-spacing: 0.03em;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 20px;
            width: fit-content;
            margin: 0 auto;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            pointer-events: none;
        }

        .lightbox-prev,
        .lightbox-next {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-size: 40px;
            cursor: pointer;
            z-index: 100000;
            opacity: 0.7;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.1);
            transition: opacity 0.2s, background 0.2s;
            user-select: none;
        }

        .lightbox-prev:hover,
        .lightbox-next:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.25);
        }

        .lightbox-prev {
            left: 20px;
        }

        .lightbox-next {
            right: 20px;
        }

        @media (max-width: 768px) {

            .lightbox-prev,
            .lightbox-next {
                font-size: 30px;
                padding: 8px 15px;
            }

            .lightbox-close {
                top: 15px;
                right: 20px;
                font-size: 36px;
            }
        }

        /* No border radius on any elements */
        .work,
        .work-overlay,
        .gallery-item,
        .masonry-grid-item,
        .promo-block,
        .container,
        .navbar {
            border-radius: 0 !important;
        }

        /* Ensure images have no border radius */
        .full-width,
        .img-responsive,
        .travel-photo {
            border-radius: 0 !important;
        }

        /* Simple pointer cursor on images */
        .gallery-item {
            cursor: pointer;
        }
    </style>

    <!-- Main Script: Click to show full image in lightbox - NO HOVER, NO BORDER RADIUS -->
    <script>
        $(document).ready(function () {
            // Collect all gallery items for prev/next navigation
            var allImages = [];
            var currentIndex = 0;

            function buildImageList() {
                allImages = [];
                $('.gallery-item').each(function () {
                    var imgSrc = $(this).data('img-src');
                    var imgAlt = $(this).data('img-alt') || $(this).find('img').attr('alt') || 'Travel Photo';
                    if (imgSrc) {
                        allImages.push({ src: imgSrc, alt: imgAlt });
                    }
                });
                console.log('✅ Loaded ' + allImages.length + ' images for lightbox');
            }

            // Open lightbox with specific image index
            function openLightbox(index) {
                if (index < 0) index = allImages.length - 1;
                if (index >= allImages.length) index = 0;
                currentIndex = index;
                var img = allImages[currentIndex];
                $('#lightboxImg').attr('src', img.src);
                $('#lightboxCaption').text(img.alt + '  (' + (currentIndex + 1) + ' / ' + allImages.length + ')');
                $('#lightboxModal').css('display', 'flex');
                $('body').css('overflow', 'hidden');
            }

            function closeLightbox() {
                $('#lightboxModal').fadeOut(200);
                $('body').css('overflow', '');
                setTimeout(function () {
                    $('#lightboxImg').attr('src', '');
                }, 200);
            }

            // Event: Click on gallery item (entire div including image) - NO hover needed, just click
            $(document).on('click', '.gallery-item', function (e) {
                e.stopPropagation();
                buildImageList();
                var clickedSrc = $(this).data('img-src');
                var index = 0;
                for (var i = 0; i < allImages.length; i++) {
                    if (allImages[i].src === clickedSrc) {
                        index = i;
                        break;
                    }
                }
                openLightbox(index);
                return false;
            });

            // Close lightbox on close button
            $('#lightboxCloseBtn').on('click', function (e) {
                e.stopPropagation();
                closeLightbox();
            });

            // Click on modal background to close
            $('#lightboxModal').on('click', function (e) {
                if ($(e.target).is('#lightboxModal')) {
                    closeLightbox();
                }
            });

            // Prev / Next buttons
            $('#lightboxPrevBtn').on('click', function (e) {
                e.stopPropagation();
                openLightbox(currentIndex - 1);
            });

            $('#lightboxNextBtn').on('click', function (e) {
                e.stopPropagation();
                openLightbox(currentIndex + 1);
            });

            // Keyboard navigation
            $(document).on('keydown', function (e) {
                if ($('#lightboxModal').is(':visible')) {
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowLeft') $('#lightboxPrevBtn').trigger('click');
                    if (e.key === 'ArrowRight') $('#lightboxNextBtn').trigger('click');
                }
            });

            // Initialize masonry layout
            if ($('.masonry-grid').length && typeof $.fn.masonry !== 'undefined') {
                $('.masonry-grid').imagesLoaded(function () {
                    $('.masonry-grid').masonry({
                        itemSelector: '.masonry-grid-item',
                        columnWidth: '.masonry-grid-sizer',
                        percentPosition: true
                    });
                });
            }

            // Ensure no border radius on any images
            $('img').css('border-radius', '0');

            console.log('✅ Gallery ready! Click any photo to view full image (no border radius, no hover effect)');
        });
    </script>
